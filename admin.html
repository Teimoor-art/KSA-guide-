<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KSA GUIDE — Article Manager</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #04110C;
      color: #F8F7F2;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      color: #E5C77B;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #AEBAB3;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(201,168,106,.25);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      color: #E5C77B;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #294338;
      background: #071A13;
      color: #F8F7F2;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #C9A86A;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      margin: 8px 5px 0 0;
      cursor: pointer;
      font-weight: bold;
      background: #C9A86A;
      color: #04110C;
    }

    button:hover {
      background: #E5C77B;
    }

    .secondary {
      background: #123126;
      color: #F8F7F2;
    }

    .danger {
      background: #552222;
      color: #fff;
    }

    .filename {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #071A13;
      color: #AEBAB3;
      word-break: break-all;
    }

    #output {
      min-height: 400px;
      font-family: monospace;
      white-space: pre;
    }

    .notice {
      border-left: 3px solid #C9A86A;
      background: rgba(201,168,106,.08);
      padding: 14px;
      border-radius: 8px;
      color: #AEBAB3;
      margin-bottom: 20px;
    }

    @media (max-width: 700px) {
      body {
        padding: 14px;
      }

      .row {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>KSA GUIDE</h1>

  <div class="subtitle">
    Article Manager — Create Jekyll Markdown Posts
  </div>

  <div class="notice">
    Fill the article details below. Generate the Markdown, copy it,
    then create a new <strong>.md</strong> file inside the
    <strong>_posts</strong> folder on GitHub.
  </div>

  <div class="card">

    <label for="title">Article Title</label>
    <input
      id="title"
      type="text"
      placeholder="Example: Complete Saudi Visa Guide"
    >

    <div class="row">

      <div>
        <label for="category">Category</label>

        <select id="category">
          <option>Saudi Guide</option>
          <option>Travel & Tourism</option>
          <option>Destinations</option>
          <option>Digital Services</option>
        </select>
      </div>

      <div>
        <label for="date">Publish Date</label>
        <input id="date" type="date">
      </div>

    </div>

    <label for="image">Featured Image URL</label>
    <input
      id="image"
      type="url"
      placeholder="https://example.com/image.jpg"
    >

    <label for="excerpt">Short Excerpt</label>
    <textarea
      id="excerpt"
      placeholder="Write a short description for Google and article cards..."
    ></textarea>

    <label for="content">Article Content</label>

    <textarea
      id="content"
      style="min-height:350px"
      placeholder="Write your article here...

## Introduction

Write your introduction.

## Requirements

- Requirement one
- Requirement two

## Important Information

Write useful information here.

## Conclusion

Write your conclusion."
    ></textarea>

    <button onclick="generatePost()">
      Generate Markdown
    </button>

    <button class="secondary" onclick="copyMarkdown()">
      Copy Markdown
    </button>

    <button class="secondary" onclick="downloadMarkdown()">
      Download .md
    </button>

    <button class="danger" onclick="clearForm()">
      Clear
    </button>

  </div>

  <div class="card">

    <h2>Generated Filename</h2>

    <div id="filename" class="filename">
      Your filename will appear here.
    </div>

  </div>

  <div class="card">

    <h2>Generated Markdown</h2>

    <textarea id="output" readonly></textarea>

  </div>

</div>

<script>

function slugify(text) {

  return text
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s-]/g, "")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-");

}


function escapeYaml(text) {

  return String(text || "")
    .replace(/\\/g, "\\\\")
    .replace(/"/g, '\\"')
    .replace(/\n/g, " ");

}


function generatePost() {

  const title =
    document.getElementById("title").value.trim();

  const category =
    document.getElementById("category").value.trim();

  const date =
    document.getElementById("date").value;

  const image =
    document.getElementById("image").value.trim();

  const excerpt =
    document.getElementById("excerpt").value.trim();

  const content =
    document.getElementById("content").value.trim();

  if (!title) {
    alert("Please enter an article title.");
    return;
  }

  if (!date) {
    alert("Please select a publish date.");
    return;
  }

  if (!content) {
    alert("Please write the article content.");
    return;
  }

  const slug = slugify(title);

  const filename =
    date + "-" + slug + ".md";

  const frontMatter =
`---
layout: null
title: "${escapeYaml(title)}"
date: ${date}
category: "${escapeYaml(category)}"
excerpt: "${escapeYaml(excerpt)}"
image: "${escapeYaml(image)}"
author: "KSA GUIDE"
---

`;

  const markdown =
    frontMatter +
    content +
    "\n";

  document.getElementById("filename").textContent =
    "_posts/" + filename;

  document.getElementById("output").value =
    markdown;

  alert(
    "Markdown generated successfully!\n\n" +
    "Filename:\n" +
    filename
  );

}


async function copyMarkdown() {

  const output =
    document.getElementById("output");

  if (!output.value) {
    alert("First generate the Markdown.");
    return;
  }

  try {

    await navigator.clipboard.writeText(
      output.value
    );

    alert("Markdown copied!");

  } catch (error) {

    output.select();
    document.execCommand("copy");

    alert("Markdown copied!");

  }

}


function downloadMarkdown() {

  const output =
    document.getElementById("output").value;

  const filename =
    document.getElementById("filename")
      .textContent
      .replace("_posts/", "");

  if (!output) {
    alert("First generate the Markdown.");
    return;
  }

  const blob =
    new Blob([output], {
      type: "text/markdown"
    });

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href = url;
  link.download = filename || "ksa-guide-article.md";

  document.body.appendChild(link);

  link.click();

  link.remove();

  URL.revokeObjectURL(url);

}


function clearForm() {

  if (
    !confirm(
      "Clear all article information?"
    )
  ) {
    return;
  }

  document.getElementById("title").value = "";
  document.getElementById("image").value = "";
  document.getElementById("excerpt").value = "";
  document.getElementById("content").value = "";
  document.getElementById("output").value = "";
  document.getElementById("filename").textContent =
    "Your filename will appear here.";

  const dateInput =
    document.getElementById("date");

  dateInput.value =
    new Date().toISOString().split("T")[0];

}


document.getElementById("date").value =
  new Date().toISOString().split("T")[0];

</script>

</body>
</html>
