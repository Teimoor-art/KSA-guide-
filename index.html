<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSA Guide — The Kingdom, Explained</title>
<meta name="description" content="Saudi Arabia's complete guide to visas, Umrah, travel, and living in the Kingdom — visa steps, Iqama help, city guides, and jobs, updated for 2026.">
<meta property="og:title" content="KSA Guide — The Kingdom, Explained">
<meta property="og:description" content="Saudi Arabia's complete guide to visas, Umrah, travel, and living in the Kingdom.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ksa-guide.com/">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://ksa-guide.com/">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2314110d'/%3E%3Ccircle cx='50' cy='26' r='2.6' fill='%23cda45e'/%3E%3Cpath d='M20 80 L20 50 C20 32 32 22 50 22 C68 22 80 32 80 50 L80 80 L65 80 L65 50 C65 40 59 35 50 35 C41 35 35 40 35 50 L35 80 Z' fill='%23cda45e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#14110d;
    --night-2:#1b1611;
    --dusk:#1c2541;
    --gold:#cda45e;
    --gold-soft:#e8d3a3;
    --rose:#a8543a;
    --cream:#f2ead9;
    --sand-dark:#241d15;
    --line: rgba(205,164,94,0.25);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--night);
    color:var(--cream);
    font-family:'Manrope',sans-serif;
    overflow-x:hidden;
  }
  ::selection{background:var(--gold);color:var(--night);}

  h1,h2,h3,.serif{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .eyebrow{
    font-family:'Manrope',sans-serif;
    font-size:0.72rem;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--gold);
    display:flex;
    align-items:center;
    gap:14px;
  }
  .eyebrow::before{
    content:'';
    width:28px;
    height:1px;
    background:var(--gold);
    display:inline-block;
  }

  /* NAV */
  header{
    position:fixed;
    top:0; left:0; right:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 5vw;
    background:linear-gradient(to bottom, rgba(20,17,13,0.9), transparent);
    backdrop-filter:blur(2px);
  }
  .brand{
    display:flex;align-items:center;gap:12px;
    font-family:'Cormorant Garamond',serif;
    font-size:1.3rem;
    letter-spacing:0.05em;
  }
  .brand-mark{
    width:26px;height:26px;position:relative;
  }
  .brand-mark svg{width:100%;height:100%;}
  nav ul{
    list-style:none;
    display:flex;
    gap:38px;
  }
  nav a{
    color:var(--cream);
    text-decoration:none;
    font-size:0.82rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    opacity:0.75;
    transition:opacity 0.25s, color 0.25s;
    position:relative;
  }
  nav a:hover{opacity:1;color:var(--gold-soft);}
  .nav-toggle{
    display:none;
    flex-direction:column;
    gap:5px;
    background:none;
    border:none;
    cursor:pointer;
    padding:6px;
    z-index:200;
  }
  .nav-toggle span{
    width:24px;height:2px;
    background:var(--cream);
    display:block;
    transition:transform 0.3s, opacity 0.3s;
  }
  .nav-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  .nav-toggle.open span:nth-child(2){opacity:0;}
  .nav-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

  /* HERO */
  .hero{
    position:relative;
    height:100vh;
    min-height:680px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(28,37,65,0.55), transparent 60%),
      linear-gradient(180deg, var(--night) 0%, #0f0c09 100%);
  }
  #hero-canvas{
    position:absolute;
    inset:0;
    z-index:1;
    opacity:0.9;
  }
  .hero-content{
    position:relative;
    z-index:2;
    max-width:760px;
    padding:0 24px;
  }
  .hero-content .eyebrow{justify-content:center;margin-bottom:26px;}
  .hero-content .eyebrow::before{display:none;}
  .hero-content .eyebrow::after{
    content:'';
    width:28px;height:1px;background:var(--gold);display:inline-block;
  }
  .hero h1{
    font-size:clamp(2.6rem, 7vw, 5.4rem);
    line-height:1.02;
    color:var(--cream);
  }
  .hero h1 em{
    font-style:italic;
    color:var(--gold);
  }
  .hero p.sub{
    margin-top:26px;
    font-size:1.05rem;
    line-height:1.7;
    color:rgba(242,234,217,0.72);
    max-width:520px;
    margin-left:auto;
    margin-right:auto;
  }
  .hero-cta{
    margin-top:42px;
    display:flex;
    gap:18px;
    justify-content:center;
  }
  .btn{
    padding:15px 32px;
    font-size:0.82rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    text-decoration:none;
    border-radius:2px;
    transition:all 0.3s ease;
    display:inline-block;
  }
  .btn-primary{
    background:var(--gold);
    color:var(--night);
    font-weight:700;
  }
  .btn-primary:hover{background:var(--gold-soft);transform:translateY(-2px);}
  .btn-ghost{
    border:1px solid var(--line);
    color:var(--cream);
  }
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold-soft);}

  .scroll-cue{
    position:absolute;
    bottom:36px;left:50%;
    transform:translateX(-50%);
    z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    color:rgba(242,234,217,0.5);
    font-size:0.68rem;
    letter-spacing:0.24em;
    text-transform:uppercase;
  }
  .scroll-cue .line{width:1px;height:38px;background:linear-gradient(var(--gold), transparent);animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:0.3;}50%{opacity:1;}}

  /* SECTIONS */
  section{
    padding:130px 5vw;
    position:relative;
  }
  .section-head{
    max-width:640px;
    margin-bottom:70px;
  }
  .section-head h2{
    font-size:clamp(2rem, 4vw, 3.2rem);
    margin-top:18px;
    color:var(--cream);
  }
  .section-head p{
    margin-top:20px;
    color:rgba(242,234,217,0.65);
    line-height:1.7;
    font-size:1.02rem;
  }

  /* QUICK FACTS */
  .facts{
    background:var(--sand-dark);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .facts-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  .fact{
    background:var(--sand-dark);
    padding:38px 30px;
    transition:background 0.3s;
  }
  .fact:hover{background:#2c2318;}
  .fact .label{
    font-size:0.7rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:12px;
  }
  .fact .val{
    font-family:'Cormorant Garamond',serif;
    font-size:1.5rem;
    color:var(--cream);
  }

  /* DESTINATIONS - 3D tilt cards */
  .dest-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:28px;
    perspective:1400px;
  }
  .dest-card{
    position:relative;
    height:400px;
    border-radius:4px;
    overflow:hidden;
    background:linear-gradient(160deg,#2a2118,#181209);
    border:1px solid var(--line);
    transform-style:preserve-3d;
    transition:transform 0.15s ease-out, box-shadow 0.3s;
    cursor:pointer;
  }
  .dest-card:hover{
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px var(--gold);
  }
  .dest-card .glow{
    position:absolute;inset:0;
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(205,164,94,0.18), transparent 55%);
    opacity:0;
    transition:opacity 0.3s;
    pointer-events:none;
  }
  .dest-card:hover .glow{opacity:1;}
  .dest-card .content{
    position:absolute;
    bottom:0;left:0;right:0;
    padding:30px 28px;
    transform:translateZ(40px);
    background:linear-gradient(to top, rgba(15,12,9,0.95), transparent);
  }
  .dest-card .tag{
    font-size:0.68rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--gold-soft);
    margin-bottom:10px;
    display:block;
  }
  .dest-card h3{
    font-size:1.7rem;
    color:var(--cream);
    margin-bottom:10px;
  }
  .dest-card p{
    font-size:0.9rem;
    color:rgba(242,234,217,0.6);
    line-height:1.55;
  }
  .dest-card .num{
    position:absolute;
    top:26px;right:28px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:0.95rem;
    color:rgba(205,164,94,0.5);
    transform:translateZ(30px);
  }

  /* SPLIT SECTIONS (visa, culture, hajj, jobs) */
  .split{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:80px;
    align-items:center;
  }
  .split.reverse .visual{order:2;}
  .split.reverse .text{order:1;}
  .visual{
    height:440px;
    border:1px solid var(--line);
    border-radius:4px;
    position:relative;
    overflow:hidden;
    background:var(--sand-dark);
  }
  .visual canvas{width:100%;height:100%;display:block;}
  .text .eyebrow{margin-bottom:22px;}
  .text h2{
    font-size:clamp(1.8rem,3.4vw,2.8rem);
    margin-bottom:22px;
  }
  .text p{
    color:rgba(242,234,217,0.68);
    line-height:1.8;
    margin-bottom:16px;
    font-size:1rem;
  }
  .checklist{
    list-style:none;
    margin-top:26px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .checklist li{
    display:flex;
    gap:14px;
    align-items:flex-start;
    font-size:0.95rem;
    color:rgba(242,234,217,0.8);
  }
  .checklist li::before{
    content:'';
    width:6px;height:6px;
    background:var(--gold);
    border-radius:50%;
    margin-top:8px;
    flex-shrink:0;
  }

  /* CULTURE STRIP */
  .culture-strip{
    background:var(--dusk);
    background:linear-gradient(180deg, #171a2c, #14110d 90%);
  }
  .culture-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:24px;
  }
  .culture-item{
    padding:34px 26px;
    border:1px solid var(--line);
    border-radius:4px;
    background:rgba(205,164,94,0.03);
    transition:transform 0.3s, background 0.3s;
  }
  .culture-item:hover{
    transform:translateY(-6px);
    background:rgba(205,164,94,0.08);
  }
  .culture-item .icon{
    width:38px;height:38px;
    margin-bottom:20px;
    color:var(--gold);
  }
  .culture-item h3{
    font-size:1.3rem;
    margin-bottom:10px;
    color:var(--cream);
  }
  .culture-item p{
    font-size:0.88rem;
    color:rgba(242,234,217,0.6);
    line-height:1.6;
  }

  /* FOOTER */
  footer{
    padding:70px 5vw 40px;
    border-top:1px solid var(--line);
  }
  .footer-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:40px;
    margin-bottom:60px;
  }
  .footer-brand h3{
    font-size:1.8rem;
    margin-bottom:14px;
  }
  .footer-brand p{
    color:rgba(242,234,217,0.55);
    max-width:340px;
    font-size:0.92rem;
    line-height:1.6;
  }
  .footer-links{
    display:flex;
    gap:70px;
  }
  .footer-col h4{
    font-size:0.72rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:18px;
  }
  .footer-col ul{list-style:none;display:flex;flex-direction:column;gap:12px;}
  .footer-col a{
    color:rgba(242,234,217,0.65);
    text-decoration:none;
    font-size:0.9rem;
    transition:color 0.25s;
  }
  .footer-col a:hover{color:var(--gold-soft);}
  .footer-bottom{
    display:flex;
    justify-content:space-between;
    padding-top:26px;
    border-top:1px solid var(--line);
    font-size:0.78rem;
    color:rgba(242,234,217,0.4);
    flex-wrap:wrap;
    gap:10px;
  }

  .reveal{
    opacity:0;
    transform:translateY(28px);
    transition:opacity 0.8s ease, transform 0.8s ease;
  }
  .reveal.visible{opacity:1;transform:translateY(0);}

  @media (max-width:900px){
    nav ul{
      display:none;
      position:fixed;
      top:0; right:0;
      width:70%; height:100vh;
      background:var(--night-2);
      flex-direction:column;
      gap:0;
      padding:100px 30px 30px;
      box-shadow:-10px 0 40px rgba(0,0,0,0.5);
      z-index:150;
    }
    nav ul.open{display:flex;}
    nav ul li{border-bottom:1px solid var(--line); width:100%;}
    nav ul li a{display:block; padding:16px 0;}
    .nav-toggle{display:flex;}
    .facts-grid{grid-template-columns:repeat(2,1fr);}
    .dest-grid{grid-template-columns:1fr;}
    .split{grid-template-columns:1fr;gap:40px;}
    .split.reverse .visual{order:1;}
    .split.reverse .text{order:2;}
    .culture-grid{grid-template-columns:repeat(2,1fr);}
    .footer-links{gap:36px;flex-wrap:wrap;}
  }
</style>
</head>
